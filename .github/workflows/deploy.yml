name: Deploy Infrastructure

on:
  push:
    branches:
      - dev
      - prod
    paths:
      - "terraform/**"
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-PantryApp
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Setup Terragrunt
        run: |
          wget -q https://github.com/gruntwork-io/terragrunt/releases/download/v0.54.0/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
          terragrunt --version

      - name: Install Python dependencies for Lambda
        run: |
          cd backend
          pip install -r requirements.txt -t .
          cd ..

      - name: Terragrunt Init
        working-directory: terraform/environments/${{ github.ref_name }}
        run: terragrunt init --terragrunt-non-interactive

      - name: Terragrunt Plan
        working-directory: terraform/environments/${{ github.ref_name }}
        run: terragrunt plan --terragrunt-non-interactive -out=tfplan

      - name: Terragrunt Apply
        working-directory: terraform/environments/${{ github.ref_name }}
        run: terragrunt apply --terragrunt-non-interactive -auto-approve tfplan

      - name: Get outputs
        working-directory: terraform/environments/${{ github.ref_name }}
        run: |
          echo "Lambda Function: $(terragrunt output --terragrunt-non-interactive -raw lambda_function_name)"
          echo "Items Table: $(terragrunt output --terragrunt-non-interactive -raw items_table_name)"
          echo "Locations Table: $(terragrunt output --terragrunt-non-interactive -raw locations_table_name)"
          echo "API URL: $(terragrunt output --terragrunt-non-interactive -raw api_gateway_invoke_url)"
          echo "Web URL: $(terragrunt output --terragrunt-non-interactive -raw web_url)"

      # --- Frontend: build the SPA and publish it to S3 + CloudFront ---------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build and deploy web frontend
        run: scripts/deploy-web.sh ${{ github.ref_name }}
